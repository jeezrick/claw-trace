stages:
  - release

release_bundle:
  stage: release
  image: node:20-bookworm
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - chmod +x build-bundle.sh
    - ./build-bundle.sh
    - >
      curl --fail
      --header "JOB-TOKEN: $CI_JOB_TOKEN"
      --upload-file public/trace-service.tgz
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/claw-trace/${CI_COMMIT_TAG}/trace-service.tgz"
